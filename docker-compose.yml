services:
  highlight:
    build: .
    image: object-highlight-nl:latest
    ports:
      - "7860:7860"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - models:/app/model
      # one-time `huggingface-cli login` on the host writes a cached token here;
      # mount just the token file (read-only) so the rest of the cache dir
      # stays writable in the container for the hub's own scratch/xet files.
      - ${USERPROFILE}/.cache/huggingface/token:/root/.cache/huggingface/token:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models: